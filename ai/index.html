<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Build Your Dream Slut - ourdream.ai</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      min-height: 100%;
      background: #09090b;
      color: #fafafa;
      font-family: Arial, sans-serif;
    }
    body {
      padding-bottom: 2rem;
      cursor: pointer;
    }
    main {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 30px 10px;
    }
    .step-container {
      width: 100%;
      max-width: 760px;
    }
    .brand-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .brand-logo img {
      height: 32px;
      width: auto;
    }
    .page-header h1 {
      text-align: center;
      font-size: 42px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .gender-control {
      width: 100%;
      margin: 20px 0;
    }
    .segmented {
      display: flex;
      gap: 8px;
      background: #121212;
      border-radius: 999px;
      padding: 4px;
    }
    .seg {
      flex: 1;
      border: 0;
      border-radius: 999px;
      padding: 12px;
      cursor: pointer;
      background: transparent;
      color: #aaa;
    }
    .seg[aria-selected="true"] {
      background: #2e2e2e;
      color: #fff;
    }
    .style-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .style-card {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      background: #18181b;
    }
    .style-card img,
    .style-card video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .style-card .gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.7), transparent 50%);
      z-index: 2;
      pointer-events: none;
    }
    .style-card .label {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      z-index: 3;
      pointer-events: none;
    }
    .style-card.selected {
      border: 3px solid #ec4899;
    }
    .begin-wrap {
      display: flex;
      justify-content: center;
      padding-top: 25px;
    }
    .begin-btn {
      width: 100%;
      max-width: 450px;
      border: 0;
      border-radius: 999px;
      padding: 16px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      font-size: 16px;
      background: linear-gradient(0deg, #ff1cac, #fd5fc2, #ff79d1);
    }
  </style>
</head>
<body>
  <main>
    <div class="step-container">
      <div class="brand-logo">
        <img src="https://ourdreamai.co/assets/OurDreamLogo.svg" alt="ourdream.ai">
      </div>
      <header class="page-header">
        <h1>AI Babe Generator</h1>
      </header>
      <div class="gender-control" role="tablist" aria-label="Gender">
        <div class="segmented">
          <button class="seg" type="button" data-gender="female" aria-selected="true">Female</button>
          <button class="seg" type="button" data-gender="male" aria-selected="false">Male</button>
          <button class="seg" type="button" data-gender="trans" aria-selected="false">Trans</button>
        </div>
      </div>
      <div class="style-grid">
        <button class="style-card selected" type="button" data-style="Realistic">
          <img src="https://ourdreamai.co/assets/posters/poster-female-nsfw-realistic.webp" alt="">
          <video autoplay loop muted playsinline preload="auto" src="https://cdn.ourdream.pics/cdn-cgi/media/width=360,fit=scale-down/https://cdn.ourdream.pics/create-videos/w600/b45c54d8-aa35-49d3-9728-a2e7b38ab4b3-hq2.mp4"></video>
          <div class="gradient"></div>
          <div class="label">Realistic</div>
        </button>
        <button class="style-card" type="button" data-style="Anime">
          <img src="https://ourdreamai.co/assets/posters/poster-female-nsfw-anime.webp" alt="">
          <video autoplay loop muted playsinline preload="auto" src="https://cdn.ourdream.pics/cdn-cgi/media/width=360,fit=scale-down/https://cdn.ourdream.pics/create-videos/w600/5855b6a7-80fc-4226-8dc7-9b2f60399365-hq2.mp4"></video>
          <div class="gradient"></div>
          <div class="label">Anime</div>
        </button>
      </div>
      <div class="begin-wrap">
        <button class="begin-btn" type="button">Begin</button>
      </div>
    </div>
  </main>

  <script>

        link.remove();

        opening = false;

    document.addEventListener("click", openDestination, true);

      passive: false
